[project]
name = "comicreel"
version = "0.1.0"
description = "Turn scanned comic books into animated motion pictures using free, open-source AI models."
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "pyyaml>=6",
    "rich>=13",
]

[project.optional-dependencies]
cpu = [
    "torch",
    "opencv-python",
    "pillow",
    "numpy",
    "transformers>=4.40,<5",
    "einops",
    "pulp",
    "scipy",
    "networkx",
    "shapely",
    "matplotlib",
    "sentencepiece",
    "timm",
    "pytesseract",
    "ollama",
]
cuda = [
    "torch",
    "opencv-python",
    "pillow",
    "numpy",
    "transformers>=4.40,<5",
    "einops",
    "pulp",
    "scipy",
    "networkx",
    "shapely",
    "matplotlib",
    "sentencepiece",
    "timm",
    "pytesseract",
    "ollama",
]
mps = [
    "torch",
    "opencv-python",
    "pillow",
    "numpy",
    "transformers>=4.40,<5",
    "einops",
    "pulp",
    "scipy",
    "networkx",
    "shapely",
    "matplotlib",
    "sentencepiece",
    "timm",
    "pytesseract",
    "ollama",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
comicreel = "comicreel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comicreel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/comicreel/cli.py" = ["B008"]  # typer.Argument/Option calls in defaults are the idiomatic typer pattern

[tool.pytest.ini_options]
testpaths = ["tests"]
